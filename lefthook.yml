pre-commit:
  parallel: true
  commands:
    scrub-identifiers:
      run: .githooks/scrub-staged.sh
    check-readme:
      run: .githooks/check-readme.sh
    check-readme-sync:
      run: .githooks/check-readme-sync.sh
    check-readme-index:
      run: .githooks/check-readme-index.sh
    check-relative-paths:
      run: .githooks/check-relative-paths.sh
    check-usernames:
      run: .githooks/check-usernames.sh
    check-pr-numbers:
      run: .githooks/check-pr-numbers.sh
    check-skill-links:
      run: .githooks/check-skill-links.sh
    check-learnings-dirs:
      run: .githooks/check-learnings-dirs.sh
    check-learning-filenames:
      run: .githooks/check-learning-filenames.sh
    check-ticket-refs:
      run: .githooks/check-ticket-refs.sh
    check-prohibited:
      run: .githooks/check-prohibited.sh

commit-msg:
  commands:
    check-prohibited-msg:
      run: .githooks/check-prohibited.sh {1}

post-merge:
  commands:
    install-skills:
      run: ./scripts/install-skills.sh
