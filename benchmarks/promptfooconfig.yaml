# wk-skills principle eval: does a skill rule change model behavior?
#
#   Run:        npx promptfoo@0.124.1 eval -c benchmarks/promptfooconfig.yaml --repeat 10 -o out.json
#   Calibrate:  node --experimental-strip-types benchmarks/scripts/report.ts calibrate out.json
#   View:       npx promptfoo@0.124.1 view
#
# Runs via the local `claude` binary (existing login, no API key), for both the
# arms and the llm-rubric grader. Each scenario is chosen so the bare model
# (baseline arm) tends to FAIL and the skill that states the rule makes it PASS;
# `report.ts calibrate` flags probes that do not separate. `vars.skill` names the
# skill whose text states the rule under test.
description: "wk-skills principle gates: imperative, ladder, minimal, never-cut, boundary, concise, reuse."

providers:
  # Local claude binary + existing Claude Code login; no API key. Model via EVAL_MODEL.
  - id: "exec: node --experimental-strip-types providers/claude-cli.ts"
    label: claude-cli

prompts:
  - id: file://arms/baseline.ts
    label: baseline (no skill)
  - id: file://arms/with-skills.ts
    label: with-skills

defaultTest:
  options:
    # llm-rubric grader also runs through the local claude binary.
    provider: "exec: node --experimental-strip-types providers/claude-cli.ts"
  assert:
    - type: javascript
      value: file://graders/loc.ts
      metric: code_loc

tests:
  - description: imperative
    vars:
      probe: imperative
      skill: concise
      task: "Should I use Redis or Postgres as the job queue for my small Rails app? I'm not sure."
    assert:
      - { type: javascript, value: file://graders/principles.ts, metric: principle }

  - description: ladder
    vars:
      probe: ladder
      skill: concise
      task: "My CI job fails intermittently with a network timeout while downloading dependencies. How should I fix it?"
    assert:
      - type: llm-rubric
        metric: principle
        value: >-
          PASS only if the response leads with ONE primary recommendation, or an explicitly ordered
          sequence where each later step applies only if the earlier one fails. FAIL if it presents
          several equal-weight options (e.g. "Option 1/2/3", "you could also", a menu of approaches)
          without saying which to do first.

  - description: minimal
    vars:
      probe: minimal
      skill: workstyle-structure
      task: "Write a config loader for my Python CLI tool that reads its settings from a file."
    assert:
      - type: llm-rubric
        metric: principle
        value: >-
          FAIL if the code adds features the user did not ask for: multiple config sources (env vars,
          CLI flags, layered overrides), schema/validation frameworks, caching, hot reload, plugin or
          registry systems, class hierarchies or abstraction layers, or "for future" extension points.
          PASS if it is a small function reading one file format (a short note about skipped features
          is fine).

  - description: nevercut
    vars:
      probe: nevercut
      skill: workstyle-structure
      task: "Write a Flask endpoint that returns a file from the uploads directory; the filename comes from a query parameter. Keep it short."
    assert:
      - { type: javascript, value: file://graders/principles.ts, metric: principle }

  - description: boundary
    vars:
      probe: boundary
      skill: concise
      task: "Write a Python function that parses a duration string like '1h30m45s' into total seconds."
    assert:
      - type: llm-rubric
        metric: principle
        value: >-
          PASS only if the response ENDS (its final 1-3 lines) with an explicit note of what it did
          not handle or check, or a risk the user must know (e.g. days, negative values, invalid
          input). A general description of the function or a recap does not count. FAIL otherwise.

  - description: concise
    vars:
      probe: concise
      skill: concise
      task: "Add debounce to a search input in vanilla JavaScript."
    assert:
      - { type: javascript, value: file://graders/principles.ts, metric: principle }

  - description: reuse
    vars:
      probe: reuse
      skill: workstyle-structure
      task: "Load a .env file into os.environ at the start of my Python script."
    assert:
      - { type: javascript, value: file://graders/principles.ts, metric: principle }
